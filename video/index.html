<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Operis - demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbfaf6;--ink:#2f3a33;--body:#4a514c;--green:#46664f;--deep:#2f4b38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0e130f;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0e130f}
/* Every scene is a real screen recording (clips/*.mp4), framed. Only the active one is visible and playing. */
.sc{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .4s}
.sc.on{opacity:1}
.sc video{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--cream);display:block}
.lab{position:absolute;left:50%;top:26px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 26px;border-radius:999px;background:rgba(20,28,22,.8);color:#fff;font-size:24px;font-weight:600;backdrop-filter:blur(6px);white-space:nowrap}
.lab i{font-style:normal;color:#9dc3a4;font-size:18px;letter-spacing:3px;text-transform:uppercase}
.sc.nolab .lab{display:none}
#ui{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:9;background:rgba(20,28,22,.82);padding:8px 12px;border-radius:999px;color:#fff;font:600 14px Inter,sans-serif;backdrop-filter:blur(6px)}
#ui button{background:#46664f;color:#fff;border:0;border-radius:999px;padding:8px 14px;font:600 14px Inter,sans-serif;cursor:pointer}
#ui button:active{background:#2f4b38}
</style></head>
<body>
<div id="stage">
  <div class="sc nolab"><video data-src="clips/00-title.mp4" muted playsinline preload="auto"></video></div>
  <div class="sc"><video data-src="clips/01-terminal-mcp.mp4" muted playsinline preload="auto"></video><div class="lab"><i>The customer agent</i>Connects over MCP</div></div>
  <div class="sc"><video data-src="clips/02-find-people.mp4" muted playsinline preload="auto"></video><div class="lab"><i>Ops agent</i>Finds the right people</div></div>
  <div class="sc"><video data-src="clips/03-website.mp4" muted playsinline preload="auto"></video><div class="lab"><i>operis.live</i>Self-serve API access</div></div>
  <div class="sc nolab"><video data-src="clips/04-worker-phone.mp4" muted playsinline preload="auto"></video></div>
  <div class="sc"><video data-src="clips/05-dashboard.mp4" muted playsinline preload="auto"></video><div class="lab"><i>Dashboard</i>Live job, agent feed, timeline</div></div>
  <div class="sc nolab"><video data-src="clips/99-end.mp4" muted playsinline preload="auto"></video></div>
</div>
<div id="ui"><button id="bp">‹ Prev</button><button id="bpl">Pause</button><button id="bn">Next ›</button><span id="ind" style="min-width:44px;text-align:center">1/7</span></div>
<script>
const $=(s,r=document)=>r.querySelector(s), scenes=[...document.querySelectorAll('.sc')], vids=scenes.map(s=>$('video',s));
const N=scenes.length; let cur=0, paused=false;
vids.forEach((v,i)=>{v.src=v.dataset.src; v.addEventListener('ended',()=>{if(i===cur&&!paused){ if(cur<N-1) go(cur+1); else $('#bpl').textContent='Replay'}});});
function go(i){
  i=Math.max(0,Math.min(N-1,i)); cur=i;
  scenes.forEach((s,k)=>{s.classList.toggle('on',k===i); if(k!==i) vids[k].pause();});
  const v=vids[i]; v.currentTime=0; if(!paused) v.play().catch(()=>{});
  $('#ind').textContent=(i+1)+'/'+N; $('#bpl').textContent=paused?'Play':'Pause';
}
$('#bn').onclick=()=>go(cur+1); $('#bp').onclick=()=>go(cur-1);
$('#bpl').onclick=()=>{
  const v=vids[cur];
  if(v.ended&&cur===N-1){paused=false;go(0);return}
  if(paused){paused=false;v.play().catch(()=>{})}else{paused=true;v.pause()}
  $('#bpl').textContent=paused?'Play':'Pause';
};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key===' '){e.preventDefault();$('#bpl').onclick()}});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$('#stage');
 st.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;}
addEventListener('resize',fit); fit();
go(0);
</script></body></html>
